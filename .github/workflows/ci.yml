name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      # golangci-lint v2. Config lives in .golangci.yaml. On Linux the entire
      # module type-checks, so this lints all packages (Windows-only dev can't,
      # because internal/service uses Unix syscall.Statfs).
      # NOTE: continue-on-error is intentional while the Unix-side packages
      # (service, handler, crawler, monitor, cmd) are still being gofmt'd into
      # the lint baseline. Flip to a hard failure once those are clean.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.5.0
          args: --timeout=5m
        continue-on-error: true

      - name: Test (race)
        run: go test -race -timeout 20m $(go list ./... | grep -v /internal/handler)

      - name: Test (handler, no race)
        run: go test -timeout 15m ./internal/handler/...

      - name: Build
        run: go build -ldflags "-s -w -X main.version=${{ github.ref_name }}" ./cmd/mibeehive

  docker:
    name: Docker Build & Push
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create Release
    needs: docker
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        run: |
          # Find previous tag
          PREV_TAG=$(git tag --sort=-version:refname | head -2 | tail -1)
          if [ "$PREV_TAG" = "${{ github.ref_name }}" ]; then
            PREV_TAG=$(git rev-list --max-parents=0 HEAD | head -1)
          fi

          # Generate diff-only notes from commits
          echo "NOTES<<EOF" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT

          # Categorize commits
          FEATS=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s" --grep="^feat" 2>/dev/null || true)
          FIXES=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s" --grep="^fix" 2>/dev/null || true)
          REFACTORS=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s" --grep="^refactor" 2>/dev/null || true)
          OTHER=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s" --invert-grep --grep="^feat|^fix|^refactor|^chore|^docs|^style|^test" 2>/dev/null || true)

          if [ -n "$FEATS" ]; then
            echo "## What's New" >> $GITHUB_OUTPUT
            echo "$FEATS" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
          fi

          if [ -n "$FIXES" ]; then
            echo "## Changed" >> $GITHUB_OUTPUT
            echo "$FIXES" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
          fi

          if [ -n "$REFACTORS" ]; then
            echo "## Refactored" >> $GITHUB_OUTPUT
            echo "$REFACTORS" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
          fi

          if [ -n "$OTHER" ]; then
            echo "## Other" >> $GITHUB_OUTPUT
            echo "$OTHER" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
          fi

          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: false
          body: ${{ steps.notes.outputs.NOTES }}
