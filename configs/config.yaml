server:
  port: 9090
  bind_addr: "0.0.0.0"
  # TLS settings for HTTPS certificate generation.
  # If empty, IPs are auto-detected from network interfaces; 127.0.0.1 is always included.
  # TLS IP addresses - customize for your network
  tls_ip_addresses: []
  # If empty, ["localhost"] is used as the default.
  tls_dns_names:
    - localhost
database:
  path: "./mibeehive.db"
storage:
  base_path: "./data"
auth:
  password_hash: ""  # default password is "admin"
  # jwt_secret will be auto-generated on first run if empty
  jwt_secret: ""
crawler:
  max_concurrent: 2
  default_interval: "6h"
  # Issue #23: transient network errors (timeout, connection reset, 5xx) are
  # retried before being marked failed; one slow source can't hang a crawl cycle.
  fetch_timeout: "60s"          # per-source deadline for the whole fetch+retry
  max_retries: 3                # retries on transient errors (4xx/rate-limited never retry)
  retry_initial_backoff: "2s"   # base delay; later retries back off ×2 with jitter
# Monitor settings for system stats sampling and disk monitoring.
monitor:
  sample_interval: 30       # seconds between system stat samples
  retention_days: 7         # how long to keep stat history
  disk_warning_percent: 90  # warn when disk usage reaches this %
  disk_critical_percent: 95 # enter degraded mode at this %
  disk_check_enabled: true  # enable/disable disk monitoring
# Log rotation settings (lumberjack).
logging:
  filename: "./mibeehive.log"  # log file path
  max_size: 10                 # MB before rotation
  max_backups: 3               # number of old log files to keep
  max_age: 30                  # days to retain old logs
  compress: true               # compress rotated logs
  local_time: true             # use local time for rotation timestamps
# Backup settings for automated database + config backup.
backup:
  enabled: false               # enable scheduled backups
  schedule: "03:00"            # daily backup time (HH:MM)
  retention: 5                 # number of backups to keep
  local_path: "./backups"      # backup output directory
  # remote_url: ""             # optional WebDAV URL for remote backup
  # remote_username: ""        # WebDAV username
  # remote_password: ""        # WebDAV password
# Container management settings (local Docker and remote orchestration).
container:
  local:
    enabled: true
    docker_host: "unix:///var/run/docker.sock"
  remote:
    enabled: true
    sync_concurrency: 2
    retention_check_interval: "1h"

