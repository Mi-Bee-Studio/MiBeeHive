apiVersion: rulesrc/v1
kind: Source
name: grafana
request:
  url: "https://api.github.com/repos/grafana/grafana/releases/latest"
  format: json
  header:
    - name: Accept
      value: "application/vnd.github+json"
list:
  path: "."
  skip:
    - ".prerelease"
    - ".draft"
extract:
  version: ".tag_name"
  version_strip: "v"
  assets:
    path: ".assets[]"
    filename: ".name"
    download_url: ".browser_download_url"
    size: ".size"
  classify: filename-parser
