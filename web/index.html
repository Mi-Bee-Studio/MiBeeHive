  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: ['selector', '[data-theme="dark"]'] };
  </script>
  <script>
    (function() {
      var theme = localStorage.getItem('mibeehive_theme') || 'system';
      function applyTheme(t) {
        var isDark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
        document.documentElement.classList.toggle('dark', isDark);
      }
      applyTheme(theme);
      window._mibeeTheme = theme;
      window._applyTheme = applyTheme;
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function() {
        if (window._mibeeTheme === 'system') applyTheme('system');
      });
    })();
  </script>
